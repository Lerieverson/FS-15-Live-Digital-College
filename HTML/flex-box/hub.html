<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Store</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        .banner{
            background:linear-gradient(90deg,#ff69b4,#ff1493);
            color:white;
            padding:70px 20px;
            text-align:center;
        }

        .card{
            transition:.3s;
        }

        .card:hover{
            transform:scale(1.05);
        }

        footer{
            background:#222;
            color:white;
            padding:15px;
            margin-top:40px;
        }

        img{
            height:250px;
            object-fit:cover;
        }
    </style>
</head>
<body>

<!-- Menu -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">💄 Beauty Store</a>
    </div>
</nav>

<!-- Banner -->
<section class="banner">
    <h1>Produtos de Beleza</h1>
    <p>Os melhores cosméticos para você.</p>
</section>

<!-- Produtos -->
<div class="container mt-5">

    <div class="row">

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500"
                class="card-img-top">

                <div class="card-body text-center">

                    <h5>Base Líquida</h5>

                    <p>R$ 59,90</p>

                    <button class="btn btn-success"
                    onclick="comprar('Base Líquida')">
                    Comprar
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500"
                class="card-img-top">

                <div class="card-body text-center">

                    <h5>Batom Matte</h5>

                    <p>R$ 39,90</p>

                    <button class="btn btn-success"
                    onclick="comprar('Batom Matte')">
                    Comprar
                    </button>

                </div>

            </div>

        </div>

        <div class="col-md-4 mb-4">

            <div class="card shadow">

                <img src="https://images.unsplash.com/photo-1541643600914-78b084683601?w=500"
                class="card-img-top">

                <div class="card-body text-center">

                    <h5>Perfume Feminino</h5>

                    <p>R$ 149,90</p>

                    <button class="btn btn-success"
                    onclick="comprar('Perfume Feminino')">
                    Comprar
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="text-center">
    © 2026 Beauty Store - Todos os direitos reservados.
</footer>

<script>

function comprar(produto){

    alert(produto + " adicionado ao carrinho!");

}

</script>

</body>
</html>
