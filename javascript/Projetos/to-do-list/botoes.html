<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>To-Do List</title>

    <!-- Bootstrap -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa, #e4e9f0);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 900px;
        }

        .todo-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
        }

        .todo-header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
        }

        .todo-header h1 {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .todo-header p {
            margin: 0;
            opacity: 0.85;
        }

        .input-group {
            border-radius: 12px;
            overflow: hidden;
        }

        #input-task {
            border: 1px solid #ddd;
            padding: 13px;
        }

        #btn-add-task {
            border: none;
            padding: 0 25px;
            background: #111827;
            color: white;
            transition: 0.3s;
        }

        #btn-add-task:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .table {
            margin-bottom: 0;
            vertical-align: middle;
        }

        .table thead {
            background: #f8fafc;
        }

        .table th {
            color: #374151;
            font-weight: 600;
        }

        .table td {
            padding: 18px 15px;
        }

        /* Botões */
        .btn-action {
            border: none;
            border-radius: 9px;
            padding: 7px 11px;
            margin: 2px;
            color: white;
            transition: all 0.25s ease;
            font-size: 14px;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }

        .btn-edit {
            background: #f59e0b;
        }

        .btn-complete {
            background: #10b981;
        }

        .btn-reject {
            background: #ef4444;
        }

        /* Tarefa concluída */
        .task-completed {
            text-decoration: line-through;
            color: #9ca3af;
            opacity: 0.7;
        }

        /* Tarefa rejeitada */
        .task-rejected {
            text-decoration: line-through;
            color: #ef4444;
            opacity: 0.65;
        }

        .status-badge {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 20px;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #9ca3af;
        }

        @media (max-width: 576px) {

            .table th:nth-child(2),
            .table td:nth-child(2) {
                width: 45%;
            }

            .btn-action {
                padding: 6px 8px;
            }

            .btn-action span {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card todo-card">

        <!-- Cabeçalho -->
        <div class="todo-header">

            <h1>
                <i class="bi bi-check2-square"></i>
                Tarefas
            </h1>

            <p>
                Organize suas tarefas de forma simples e eficiente.
            </p>

        </div>

        <!-- Conteúdo -->
        <div class="card-body p-4">

            <!-- Formulário -->
            <form id="form-task">

                <div class="input-group mb-4">

                    <input 
                        type="text"
                        id="input-task"
                        class="form-control"
                        placeholder="Digite uma nova tarefa..."
                        autocomplete="off"
                    >

                    <button 
                        type="submit"
                        id="btn-add-task"
                        class="btn"
                    >
                        <i class="bi bi-plus-lg"></i>
                        Adicionar
                    </button>

                </div>

            </form>

            <!-- Tabela -->
            <div class="table-responsive">

                <table class="table table-hover">

                    <thead>

                        <tr>
                            <th>Tarefa</th>
                            <th>Status</th>
                            <th class="text-center">Ações</th>
                        </tr>

                    </thead>

                    <tbody id="list-task">

                        <tr id="empty-row">

                            <td colspan="3" class="empty-message">

                                <i class="bi bi-clipboard-x fs-2 d-block mb-2"></i>

                                Nenhuma tarefa cadastrada.

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>


<script>

const formTask = document.getElementById('form-task');
const inputTask = document.getElementById('input-task');
const tBody = document.getElementById('list-task');


// Adicionar tarefa
formTask.addEventListener('submit', function(event) {

    event.preventDefault();

    const texto = inputTask.value.trim();

    // Não permite tarefa vazia
    if (texto === '') {

        inputTask.classList.add('is-invalid');

        inputTask.focus();

        return;
    }

    inputTask.classList.remove('is-invalid');

    // Remove mensagem de lista vazia
    const emptyRow = document.getElementById('empty-row');

    if (emptyRow) {
        emptyRow.remove();
    }

    // Criar linha
    const tr = document.createElement('tr');

    // Coluna da tarefa
    const taskTd = document.createElement('td');

    taskTd.innerHTML = `
        <strong>${texto}</strong>
    `;

    // Coluna status
    const statusTd = document.createElement('td');

    statusTd.innerHTML = `
        <span class="badge bg-secondary status-badge">
            Pendente
        </span>
    `;

    // Coluna ações
    const actionsTd = document.createElement('td');

    actionsTd.classList.add('text-center');

    actionsTd.innerHTML = `

        <!-- Editar -->
        <button 
            class="btn-action btn-edit"
            title="Editar tarefa"
            onclick="editarTarefa(this)"
        >
            <i class="bi bi-pencil"></i>
            <span>Editar</span>
        </button>

        <!-- Concluir -->
        <button 
            class="btn-action btn-complete"
            title="Concluir tarefa"
            onclick="concluirTarefa(this)"
        >
            <i class="bi bi-check-lg"></i>
            <span>Concluir</span>
        </button>

        <!-- Rejeitar -->
        <button 
            class="btn-action btn-reject"
            title="Rejeitar tarefa"
            onclick="rejeitarTarefa(this)"
        >
            <i class="bi bi-x-lg"></i>
            <span>Rejeitar</span>
        </button>

    `;

    // Adicionar elementos na linha
    tr.appendChild(taskTd);
    tr.appendChild(statusTd);
    tr.appendChild(actionsTd);

    // Adicionar linha na tabela
    tBody.appendChild(tr);

    // Limpar campo
    inputTask.value = '';

    inputTask.focus();

});


// ==========================================
// EDITAR TAREFA
// ==========================================

function editarTarefa(button) {

    const tr = button.closest('tr');

    const taskTd = tr.children[0];

    const textoAtual = taskTd.innerText;

    const novoTexto = prompt(
        'Digite o novo nome da tarefa:',
        textoAtual
    );

    if (novoTexto !== null && novoTexto.trim() !== '') {

        taskTd.innerHTML = `
            <strong>${novoTexto.trim()}</strong>
        `;

    }

}


// ==========================================
// CONCLUIR TAREFA
// ==========================================

function concluirTarefa(button) {

    const tr = button.closest('tr');

    const taskTd = tr.children[0];

    const statusTd = tr.children[1];

    // Verifica se já foi concluída
    if (tr.classList.contains('task-completed')) {

        tr.classList.remove('task-completed');

        statusTd.innerHTML = `
            <span class="badge bg-secondary status-badge">
                Pendente
            </span>
        `;

        button.innerHTML = `
            <i class="bi bi-check-lg"></i>
            <span>Concluir</span>
        `;

        return;
    }

    // Marcar como concluída
    tr.classList.remove('task-rejected');

    tr.classList.add('task-completed');

    statusTd.innerHTML = `
        <span class="badge bg-success status-badge">
            Concluída
        </span>
    `;

    button.innerHTML = `
        <i class="bi bi-arrow-counterclockwise"></i>
        <span>Desfazer</span>
    `;

}


// ==========================================
// REJEITAR TAREFA
// ==========================================

function rejeitarTarefa(button) {

    const tr = button.closest('tr');

    const statusTd = tr.children[1];

    // Confirmação
    const confirmar = confirm(
        'Deseja realmente rejeitar esta tarefa?'
    );

    if (!confirmar) {
        return;
    }

    tr.classList.remove('task-completed');

    tr.classList.add('task-rejected');

    statusTd.innerHTML = `
        <span class="badge bg-danger status-badge">
            Rejeitada
        </span>
    `;

}


// ==========================================
// REMOVE ERRO DO INPUT AO DIGITAR
// ==========================================

inputTask.addEventListener('input', function() {

    if (inputTask.value.trim() !== '') {

        inputTask.classList.remove('is-invalid');

    }

});

</script>

</body>
</html>
